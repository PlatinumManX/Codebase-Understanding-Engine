<form action="#" class="space-y-5" method="POST" onsubmit="return false;">
<!-- Full Name -->

<input class="w-full pl-10 pr-4 py-2.5 bg-surface border border-outline-variant rounded-lg font-body-base text-body-base text-on-surface placeholder:text-outline/60 input-focus-ring transition-all" id="name" name="name" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-1.5">
<label class="font-label-bold text-label-bold text-on-surface-variant block" for="email">EMAIL ADDRESS</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors text-[20px]">mail</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-surface border border-outline-variant rounded-lg font-body-base text-body-base text-on-surface placeholder:text-outline/60 input-focus-ring transition-all" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="font-label-bold text-label-bold text-on-surface-variant block" for="password">PASSWORD</label>

</div>
</div>
<div class="space-y-1.5">
<label class="font-label-bold text-label-bold text-on-surface-variant block" for="confirm_password">CONFIRM</label>

<script>
        // Micro-interaction: Password visibility toggle (simulated/optional)
        document.querySelectorAll('input[type="password"]').forEach(input => {
            // Logic for a real app would go here
        });

        // Add subtle mouse-tracking movement to the background glow
        document.addEventListener('mousemove', (e) => {
            const glows = document.querySelectorAll('.bg-primary\\/5, .bg-secondary\\/5');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            glows.forEach((glow, index) => {
                const multiplier = index === 0 ? 30 : -30;
                glow.style.transform = `translate(${x * multiplier}px, ${y * multiplier}px)`;
            });
        });
    </script>
