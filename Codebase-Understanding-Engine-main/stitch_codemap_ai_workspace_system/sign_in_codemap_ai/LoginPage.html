<body class="flex items-center justify-center min-h-screen p-4 bg-background">
<!-- Atmospheric Animated Background (Subtle) -->
<div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none opacity-40">

</div>
<!-- Login Container -->
<main class="w-full max-w-[440px] z-10">
<!-- Center Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-10 login-card transition-all duration-300">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-8">
<div class="w-12 h-12 bg-primary rounded-lg flex items-center justify-center mb-4 shadow-sm">
<span class="material-symbols-outlined text-on-primary text-3xl" style="font-variation-settings: 'FILL' 1;">hub</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface text-center">Access Your CodeMap Workspace</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2 text-center">Enter your credentials to continue to the intelligent engine.</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-6" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-1.5" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-surface-bright border border-outline-variant rounded-lg font-body-base text-body-base text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="block font-label-bold text-label-bold text-on-surface-variant" for="password">Password</label>
<a class="font-label-bold text-label-bold text-primary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-12 py-2.5 bg-surface-bright border border-outline-variant rounded-lg font-body-base text-body-base text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary" id="remember" type="checkbox"/>
<label class="ml-2 font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">Remember me for 30 days</label>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary py-3 rounded-lg font-label-bold text-label-bold hover:bg-on-primary-fixed-variant active:scale-[0.98] transition-all shadow-sm" type="submit">
                    Sign In to Workspace
                </button>
</form>
<!-- SSO / Alternative Options Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center"><span class="w-full border-t border-outline-variant"></span></div>
<div class="relative flex justify-center text-label-bold uppercase"><span class="bg-surface-container-lowest px-4 text-outline">Or continue with</span></div>
</div>
<!-- Social/SSO Buttons -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-2.5 border border-outline-variant rounded-lg bg-surface-bright hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<div class="w-5 h-5 bg-contain bg-center bg-no-repeat" data-alt="A clean, minimalist logo of a software giant, rendered in professional vector style, isolated on a white background, representing enterprise security and reliable integration." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAeMjUvVf02zOrK0YMI77PSUXQr9UUWmpPJXKkseeqBP0dXJgeBKjrgZSw-trMNsTMD8doHLF3nbLRBtZv2DfF8_bImWSApr-AA819DFa2tPWaZYVbXE5yHUzSLvngNUow-Ar65W89snfzv0asXkIMccGxFT5Hdy9Gnis8AySqtgDXMeDIPzgZk6-kmzsvSNAa6rhFF9hzCTf9iLJOh_EEleWXzsG3KHqRJPd7MV8xFtskTjDf-ZubQfCSFIb9L51NvFKLwxSe1zX0')"></div>

<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.closest('.relative')?.classList.add('scale-[1.01]');
                });
                input.addEventListener('blur', () => {
                    input.parentElement.closest('.relative')?.classList.remove('scale-[1.01]');
                });
            });

            // Toggle Password Visibility
            const togglePassword = document.querySelector('button[type="button"]');
            const passwordInput = document.getElementById('password');
            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', () => {
                    const isPassword = passwordInput.type === 'password';
                    passwordInput.type = isPassword ? 'text' : 'password';
                    togglePassword.querySelector('.material-symbols-outlined').textContent = isPassword ? 'visibility_off' : 'visibility';
                });
            }
        });
    </script>
